[package]
name = "c2s-setup"
version = "0.1.0"
edition = "2021"
authors = ["snbhowmik <Subir Nath Bhowmik>"]
description = "Ratatui TUI Installer and Student User Manager for C2S Environments"

[dependencies]
ratatui = "0.26.3"
crossterm = "0.27.0"
tokio = { version = "1.36.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ansi-to-tui = "4.0.0"
users = "0.11"
chrono = "0.4"
clap = { version = "4.6.7", features = ["derive"] }
